<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eksperimen N-Back</title>

  <!-- jsPsych -->
  <script src="https://unpkg.com/jspsych@8.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>

  <link
    href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css"
    rel="stylesheet"
  >

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .jspsych-content {
      max-width: 900px;
    }

    /* =========================
       INSTRUKSI
       ========================= */

    .instruction-box {
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
      line-height: 1.7;
    }

    .instruction-box h1,
    .instruction-box h2 {
      margin-top: 0;
    }


    /* =========================
       HURUF
       ========================= */

    .letter {
      font-size: 120px;
      font-weight: bold;
      margin: 30px 0;
    }

    .response-info {
      font-size: 23px;
      margin-top: 20px;
    }


    /* =========================
       TIMER RONDE 1
       ========================= */

    .timer-container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto 25px auto;
    }

    .timer-text {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .timer-bar {
      width: 100%;
      height: 30px;
      background: #ddd;
      border-radius: 15px;
      overflow: hidden;
      border: 2px solid #aaa;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: #333;
      transition: width 0.05s linear;
    }


    /* =========================
       FEEDBACK
       ========================= */

    .feedback {
      font-size: 65px;
      font-weight: bold;
      margin: 45px 0 25px 0;
    }

    .feedback-correct {
      color: green;
    }

    .feedback-wrong {
      color: red;
    }

    .feedback-timeout {
      color: darkorange;
    }

    .space-info {
      font-size: 24px;
      margin-top: 30px;
    }


    /* =========================
       SAVE
       ========================= */

    .save-box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
      text-align: center;
    }

    .save-button {
      font-size: 28px;
      font-weight: bold;
      padding: 18px 45px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #222;
      color: white;
      margin-top: 20px;
    }

    .save-button:hover {
      background: #444;
    }

    .saved-message {
      font-size: 24px;
      color: green;
      font-weight: bold;
      margin-top: 25px;
    }

    .small-note {
      color: #666;
      font-size: 16px;
    }

  </style>
</head>


<body>

<script>

  // ============================================================
  // INISIALISASI
  // ============================================================

  const jsPsych = initJsPsych({
    on_finish: function() {
      console.log("Eksperimen selesai.");
    }
  });


  // ============================================================
  // PENGATURAN EKSPERIMEN
  // ============================================================

  const TOTAL_STIMULI = 22;

  // RONDE 1 = 5 DETIK
  const TIME_LIMIT = 5000;

  let participantID = "";


  // ============================================================
  // MEMBUAT SEQUENCE 2-BACK
  // ============================================================

  function generateNBackStimuli(total) {

    const letters =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

    let sequence = [];

    // Dua huruf pertama
    sequence.push(
      letters[
        Math.floor(Math.random() * letters.length)
      ]
    );

    sequence.push(
      letters[
        Math.floor(Math.random() * letters.length)
      ]
    );


    // Huruf ke-3 sampai ke-22
    for (let i = 2; i < total; i++) {

      const shouldBeTarget =
        Math.random() < 0.4;

      if (shouldBeTarget) {

        // TARGET
        // Sama dengan huruf 2 langkah sebelumnya
        sequence.push(
          sequence[i - 2]
        );

      } else {

        // NON-TARGET
        let newLetter;

        do {

          newLetter =
            letters[
              Math.floor(
                Math.random() * letters.length
              )
            ];

        } while (
          newLetter === sequence[i - 2]
        );

        sequence.push(newLetter);
      }
    }

    return sequence;
  }


  // ============================================================
  // MEMBUAT STIMULUS UNTUK 2 RONDE
  // ============================================================

  const round1Stimuli =
    generateNBackStimuli(TOTAL_STIMULI);

  const round2Stimuli =
    generateNBackStimuli(TOTAL_STIMULI);


  // ============================================================
  // ID PESERTA
  // ============================================================

  const participantScreen = {

    type: jsPsychHtmlKeyboardResponse,

    stimulus: `

      <div class="instruction-box">

        <h1>Eksperimen N-Back</h1>

        <p>
          Sebelum memulai, silakan masukkan
          ID peserta.
        </p>

        <input
          type="text"
          id="participant-id"
          style="
            font-size:24px;
            padding:12px;
            width:80%;
            max-width:400px;
          "
          placeholder="Contoh: P01"
        >

        <br><br>

        <button
          id="start-button"
          style="
            font-size:22px;
            padding:12px 30px;
            cursor:pointer;
          "
        >
          MULAI
        </button>

      </div>
    `,

    choices: "NO_KEYS",

    on_load: function() {

      document
        .getElementById("start-button")
        .addEventListener(
          "click",
          function() {

            const input =
              document.getElementById(
                "participant-id"
              );

            if (
              input.value.trim() === ""
            ) {

              alert(
                "Silakan masukkan ID peserta terlebih dahulu."
              );

              return;
            }

            participantID =
              input.value.trim();

            jsPsych.data.addProperties({
              participant: participantID
            });

            jsPsych.finishTrial();
          }
        );
    }
  };


  // ============================================================
  // INSTRUKSI UMUM
  // ============================================================

  const generalInstruction = {

    type: jsPsychHtmlKeyboardResponse,

    stimulus: `

      <div class="instruction-box">

        <h1>Petunjuk Umum</h1>

        <p>
          Anda akan melihat serangkaian huruf
          satu per satu.
        </p>

        <p>
          Tugas Anda adalah membandingkan
          huruf yang sedang muncul dengan
          <strong>huruf 2 langkah sebelumnya</strong>.
        </p>

        <hr>

        <h2>Jika SAMA → tekan F</h2>

        <h2>Jika TIDAK SAMA → tekan J</h2>

        <hr>

        <p>
          Dua huruf pertama tidak perlu dijawab
          karena belum memiliki huruf
          2 langkah sebelumnya.
        </p>

        <p>
          Perhatikan instruksi khusus
          pada masing-masing ronde.
        </p>

        <p>
          <strong>
            Tekan SPASI untuk melanjutkan.
          </strong>
        </p>

      </div>
    `,

    choices: [" "]
  };


  // ============================================================
  // INSTRUKSI RONDE 1
  // ============================================================

  const round1Instruction = {

    type: jsPsychHtmlKeyboardResponse,

    stimulus: `

      <div class="instruction-box">

        <h1>RONDE 1</h1>

        <h2>Dengan Batas Waktu</h2>

        <p>
          Pada ronde ini akan terdapat
          <strong>timer di layar</strong>.
        </p>

        <p>
          Setiap huruf memiliki waktu
          <strong>5 detik</strong>.
        </p>

        <hr>

        <h2>F = SAMA</h2>

        <h2>J = TIDAK SAMA</h2>

        <hr>

        <p>
          Anda harus menjawab sebelum
          waktu 5 detik habis.
        </p>

        <p>
          Setelah Anda menjawab,
          akan muncul feedback:
        </p>

        <h3>
          ✓ BENAR
        </h3>

        <h3>
          ✗ SALAH
        </h3>

        <p>
          Jika waktu habis:
        </p>

        <h3>
          ⏰ WAKTU HABIS
        </h3>

        <p>
          Setelah feedback,
          sistem otomatis pindah
          ke huruf berikutnya.
        </p>

        <p>
          <strong>
            Tekan SPASI untuk memulai Ronde 1.
          </strong>
        </p>

      </div>
    `,

    choices: [" "]
  };


  // ============================================================
  // INSTRUKSI RONDE 2
  // ============================================================

  const round2Instruction = {

    type: jsPsychHtmlKeyboardResponse,

    stimulus: `

      <div class="instruction-box">

        <h1>RONDE 2</h1>

        <h2>Tanpa Batas Waktu</h2>

        <p>
          Pada ronde ini
          <strong>tidak ada timer</strong>.
        </p>

        <p>
          Anda dapat mengerjakan
          dengan kecepatan Anda sendiri.
        </p>

        <hr>

        <h2>F = SAMA</h2>

        <h2>J = TIDAK SAMA</h2>

        <hr>

        <p>
          Setelah menjawab F atau J,
          akan muncul feedback:
        </p>

        <h3>
          ✓ BENAR
        </h3>

        <h3>
          ✗ SALAH
        </h3>

        <p>
          Setelah feedback muncul,
          Anda dapat menekan:
        </p>

        <h2>SPASI</h2>

        <p>
          untuk berpindah ke huruf berikutnya.
        </p>

        <p>
          <strong>
            Tekan SPASI untuk memulai Ronde 2.
          </strong>
        </p>

      </div>
    `,

    choices: [" "]
  };


  // ============================================================
  // TRIAL RONDE 1
  // ============================================================

  function createRound1Trial(
    letter,
    trialNumber,
    stimuli
  ) {

    let timerInterval = null;

    return {

      type: jsPsychHtmlKeyboardResponse,

      stimulus: `

        <div>

          <!-- TIMER -->

          <div class="timer-container">

            <div class="timer-text">

              Waktu:
              <span id="timer-number">
                5.00
              </span>
              detik

            </div>

            <div class="timer-bar">

              <div
                id="timer-fill"
                class="timer-fill"
              ></div>

            </div>

          </div>


          <!-- HURUF -->

          <div class="letter">
            ${letter}
          </div>


          <!-- PETUNJUK -->

          <div class="response-info">

            <strong>F</strong>
            = SAMA

            &nbsp;&nbsp;&nbsp;&nbsp;

            <strong>J</strong>
            = TIDAK SAMA

          </div>

        </div>
      `,

      choices: ["f", "j"],

      trial_duration: TIME_LIMIT,

      response_ends_trial: true,

      data: {

        phase: "test",

        round: 1,

        condition: "timer",

        trial_in_round:
          trialNumber,

        stimulus:
          letter,

        deadline:
          TIME_LIMIT
      },


      // =========================
      // MULAI TIMER
      // =========================

      on_load: function() {

        const startTime =
          performance.now();

        timerInterval =
          setInterval(
            function() {

              const elapsed =
                performance.now()
                - startTime;

              const remaining =
                Math.max(
                  0,
                  TIME_LIMIT - elapsed
                );

              const seconds =
                (
                  remaining / 1000
                ).toFixed(2);


              // ANGKA TIMER

              const numberElement =
                document.getElementById(
                  "timer-number"
                );

              if (numberElement) {

                numberElement.textContent =
                  seconds;

              }


              // PROGRESS BAR

              const fillElement =
                document.getElementById(
                  "timer-fill"
                );

              if (fillElement) {

                const percentage =
                  (
                    remaining /
                    TIME_LIMIT
                  ) * 100;

                fillElement.style.width =
                  percentage + "%";
              }


            },
            20
          );
      },


      // =========================
      // SELESAI TRIAL
      // =========================

      on_finish: function(data) {

        if (
          timerInterval !== null
        ) {

          clearInterval(
            timerInterval
          );
        }


        // Dua huruf pertama
        // tidak dinilai

        if (
          trialNumber <= 2
        ) {

          data.correct =
            null;

          data.accuracy =
            null;

          data.timeout =
            false;

          return;
        }


        const previousLetter =
          stimuli[
            trialNumber - 3
          ];


        const isTarget =
          letter === previousLetter;

        data.target =
          isTarget;


        // =========================
        // TIDAK MENJAWAB
        // =========================

        if (
          data.response === null
        ) {

          data.timeout =
            true;

          data.correct =
            false;

          data.accuracy =
            0;

          return;
        }


        data.timeout =
          false;


        // =========================
        // CEK JAWABAN
        // =========================

        let correct =
          false;


        if (
          isTarget &&
          data.response === "f"
        ) {

          correct = true;

        }


        if (
          !isTarget &&
          data.response === "j"
        ) {

          correct = true;

        }


        data.correct =
          correct;

        data.accuracy =
          correct ? 1 : 0;
      }
    };
  }


  // ============================================================
  // FEEDBACK RONDE 1
  // ============================================================

  const round1Feedback = {

    type: jsPsychHtmlKeyboardResponse,

    stimulus: function() {

      const lastData =
        jsPsych.data
          .get()
          .last(1)
          .values()[0];


      // Dua huruf pertama

      if (
        lastData.trial_in_round <= 2
      ) {

        return `

          <div class="feedback">
            MULAI
          </div>

        `;
      }


      // WAKTU HABIS

      if (
        lastData.timeout
      ) {

        return `

          <div
            class="
              feedback
              feedback-timeout
            "
          >
            ⏰ WAKTU HABIS
          </div>

        `;
      }


      // BENAR

      if (
        lastData.correct
      ) {

        return `

          <div
            class="
              feedback
              feedback-correct
            "
          >
            ✓ BENAR
          </div>

        `;
      }


      // SALAH

      return `

        <div
          class="
            feedback
            feedback-wrong
          "
        >
          ✗ SALAH
        </div>

      `;
    },


    choices:
      "NO_KEYS",


    // Feedback tampil
    // 1 detik

    trial_duration:
      1000,


    data: {

      phase:
        "feedback",

      round:
        1

    }
  };


  // ============================================================
  // TRIAL RONDE 2
  // ============================================================

  function createRound2Trial(
    letter,
    trialNumber,
    stimuli
  ) {

    return {

      type:
        jsPsychHtmlKeyboardResponse,


      stimulus: `

        <div>

          <!-- TIDAK ADA TIMER -->

          <div
            style="
              height:80px;
            "
          >
          </div>


          <!-- HURUF -->

          <div class="letter">
            ${letter}
          </div>


          <!-- PETUNJUK -->

          <div class="response-info">

            <strong>F</strong>
            = SAMA

            &nbsp;&nbsp;&nbsp;&nbsp;

            <strong>J</strong>
            = TIDAK SAMA

          </div>


          <p
            style="
              font-size:20px;
              margin-top:25px;
            "
          >
            Tidak ada batas waktu.
          </p>

        </div>
      `,


      choices:
        ["f", "j"],


      response_ends_trial:
        true,


      data: {

        phase:
          "test",

        round:
          2,

        condition:
          "no_timer",

        trial_in_round:
          trialNumber,

        stimulus:
          letter
      },


      on_finish:
        function(data) {


          // Dua huruf pertama

          if (
            trialNumber <= 2
          ) {

            data.correct =
              null;

            data.accuracy =
              null;

            return;
          }


          const previousLetter =
            stimuli[
              trialNumber - 3
            ];


          const isTarget =
            letter === previousLetter;

          data.target =
            isTarget;


          let correct =
            false;


          if (
            isTarget &&
            data.response === "f"
          ) {

            correct = true;
          }


          if (
            !isTarget &&
            data.response === "j"
          ) {

            correct = true;
          }


          data.correct =
            correct;

          data.accuracy =
            correct ? 1 : 0;

        }
    };
  }


  // ============================================================
  // FEEDBACK RONDE 2
  // ============================================================

  const round2Feedback = {

    type:
      jsPsychHtmlKeyboardResponse,


    stimulus:
      function() {

        const lastData =
          jsPsych.data
            .get()
            .last(1)
            .values()[0];


        // Dua huruf pertama

        if (
          lastData.trial_in_round <= 2
        ) {

          return `

            <div class="feedback">
              MULAI
            </div>

            <div class="space-info">
              Tekan SPASI untuk lanjut
            </div>

          `;
        }


        // BENAR

        if (
          lastData.correct
        ) {

          return `

            <div
              class="
                feedback
                feedback-correct
              "
            >
              ✓ BENAR
            </div>

            <div class="space-info">
              Tekan SPASI untuk lanjut
            </div>

          `;
        }


        // SALAH

        return `

          <div
            class="
              feedback
              feedback-wrong
            "
          >
            ✗ SALAH
          </div>

          <div class="space-info">
            Tekan SPASI untuk lanjut
          </div>

        `;
      },


    // Harus SPASI
    // untuk lanjut

    choices:
      [" "],


    data: {

      phase:
        "feedback",

      round:
        2

    }
  };


  // ============================================================
  // TIMELINE RONDE 1
  // ============================================================

  const round1Timeline =
    [];


  for (
    let i = 0;
    i < round1Stimuli.length;
    i++
  ) {

    const trialNumber =
      i + 1;


    round1Timeline.push(

      createRound1Trial(
        round1Stimuli[i],
        trialNumber,
        round1Stimuli
      )

    );


    round1Timeline.push(
      round1Feedback
    );
  }


  // ============================================================
  // ISTIRAHAT
  // ============================================================

  const breakScreen = {

    type:
      jsPsychHtmlKeyboardResponse,


    stimulus: `

      <div class="instruction-box">

        <h1>Istirahat</h1>

        <p>
          Ronde 1 sudah selesai.
        </p>

        <p>
          Silakan beristirahat sebentar.
        </p>

        <p>
          Pada Ronde 2 tidak akan ada
          batas waktu.
        </p>

        <p>
          Anda dapat mengerjakan
          dengan kecepatan Anda sendiri.
        </p>

        <p>
          <strong>
            Tekan SPASI untuk melanjutkan.
          </strong>
        </p>

      </div>
    `,


    choices:
      [" "]
  };


  // ============================================================
  // TIMELINE RONDE 2
  // ============================================================

  const round2Timeline =
    [];


  for (
    let i = 0;
    i < round2Stimuli.length;
    i++
  ) {

    const trialNumber =
      i + 1;


    round2Timeline.push(

      createRound2Trial(
        round2Stimuli[i],
        trialNumber,
        round2Stimuli
      )

    );


    round2Timeline.push(
      round2Feedback
    );
  }


  // ============================================================
  // HALAMAN SAVE
  // ============================================================

  const finishScreen = {

    type:
      jsPsychHtmlKeyboardResponse,


    stimulus: `

      <div class="save-box">

        <h1>Eksperimen Selesai</h1>

        <p>
          Terima kasih.
        </p>

        <p>
          Semua tugas N-back telah selesai.
        </p>

        <hr>

        <p>
          Untuk menyimpan hasil penelitian:
        </p>

        <h2>
          Tekan tombol S
        </h2>

        <p>
          atau klik tombol di bawah.
        </p>


        <button
          id="save-button"
          class="save-button"
        >
          S — SIMPAN HASIL
        </button>


        <div
          id="saved-message"
          class="saved-message"
        ></div>


        <p class="small-note">
          Hasil akan disimpan dalam format CSV
          dan dapat dibuka menggunakan Microsoft Excel.
        </p>

      </div>
    `,


    choices:
      "NO_KEYS",


    on_load:
      function() {

        let saved =
          false;


        // =========================
        // FUNGSI SAVE
        // =========================

        function saveData() {

          if (saved) {
            return;
          }


          saved =
            true;


          // Ambil data TEST saja

          const data =
            jsPsych.data
              .get()
              .filter({
                phase:
                  "test"
              });


          const filename =
            "hasil_nback_" +
            participantID +
            ".csv";


          // DOWNLOAD CSV

          data.localSave(
            "csv",
            filename
          );


          // PESAN

          document.getElementById(
            "saved-message"
          ).innerHTML = `

            ✓ HASIL BERHASIL DISIMPAN

            <br>

            <span
              style="
                font-size:17px;
                color:#555;
              "
            >
              File:
              ${filename}
            </span>

          `;


          // Matikan tombol

          document.getElementById(
            "save-button"
          ).disabled =
            true;


          document.getElementById(
            "save-button"
          ).style.opacity =
            "0.6";
        }


        // =========================
        // KLIK TOMBOL
        // =========================

        document
          .getElementById(
            "save-button"
          )
          .addEventListener(
            "click",
            saveData
          );


        // =========================
        // TEKAN S
        // =========================

        function keyHandler(event) {

          if (
            event.key.toLowerCase()
            === "s"
          ) {

            saveData();

          }
        }


        document.addEventListener(
          "keydown",
          keyHandler
        );
      }
  };


  // ============================================================
  // TIMELINE UTAMA
  // ============================================================

  const timeline = [

    participantScreen,

    generalInstruction,


    // RONDE 1

    round1Instruction,

    ...round1Timeline,


    // ISTIRAHAT

    breakScreen,


    // RONDE 2

    round2Instruction,

    ...round2Timeline,


    // SAVE

    finishScreen
  ];


  // ============================================================
  // MULAI EKSPERIMEN
  // ============================================================

  jsPsych.run(
    timeline
  );

</script>

</body>
</html>
