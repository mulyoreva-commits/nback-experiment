<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>Eksperimen 2-Back</title>

    <script src="https://unpkg.com/jspsych@8.2.1"></script>

    <link
        href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>

</head>

<body></body>

<script>

/* =====================================================
   PENGATURAN DASAR
   ===================================================== */

const jsPsych = initJsPsych({

    on_finish: function() {

        jsPsych.data
            .get()
            .localSave(
                "csv",
                "hasil_nback.csv"
            );

    }

});


const timeline = [];


/* =====================================================
   VARIABEL PESERTA
   ===================================================== */

let participantID = "";


/* =====================================================
   INPUT KODE PESERTA
   ===================================================== */

timeline.push({

    type: jsPsychHtmlKeyboardResponse,

    stimulus: `

        <h2>Eksperimen Working Memory</h2>

        <p>
        Masukkan kode peserta.
        </p>

        <input
            id="participant"
            type="text"
            placeholder="Contoh: P01"
            style="
                font-size:20px;
                padding:10px;
            "
        >

        <br><br>

        <button
            id="startButton"
            style="
                font-size:20px;
                padding:10px 25px;
            "
        >
            Mulai
        </button>

    `,

    choices: "NO_KEYS",

    on_load: function() {

        document
            .getElementById("startButton")
            .addEventListener("click", function() {

                participantID =
                    document
                    .getElementById("participant")
                    .value;

                if (
                    participantID.trim() === ""
                ) {

                    alert(
                        "Silakan masukkan kode peserta."
                    );

                    return;
                }

                jsPsych.finishTrial();

            });

    },

    data: {

        phase: "participant_info"

    }

});


/* =====================================================
   INSTRUKSI
   ===================================================== */

timeline.push({

    type: jsPsychHtmlKeyboardResponse,

    stimulus: `

        <h2>Petunjuk 2-Back</h2>

        <p>
        Anda akan melihat huruf satu per satu.
        </p>

        <p>
        Tugas Anda adalah membandingkan huruf
        yang sedang muncul dengan huruf
        <b>2 langkah sebelumnya</b>.
        </p>

        <br>

        <p>
        Jika <b>SAMA</b>:
        </p>

        <h2>F</h2>

        <p>
        Jika <b>TIDAK SAMA</b>:
        </p>

        <h2>J</h2>

        <br>

        <p>
        Huruf akan berpindah secara otomatis.
        </p>

        <p>
        Jawab secepat dan seakurat mungkin.
        </p>

        <br>

        <p>
        Tekan <b>SPASI</b> untuk memulai latihan.
        </p>

    `,

    choices: [" "]

});


/* =====================================================
   FUNGSI MEMBUAT SEQUENCE 2-BACK
   ===================================================== */

function createSequence(numberOfTrials) {

    const letters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

    const sequence = [];

    for (
        let i = 0;
        i < numberOfTrials;
        i++
    ) {

        /*
        Dua stimulus pertama
        tidak dapat menjadi target.
        */

        if (i < 2) {

            let letter;

            do {

                letter =
                    letters[
                        Math.floor(
                            Math.random() *
                            letters.length
                        )
                    ];

            } while (
                i > 0 &&
                letter === sequence[i - 1]
            );

            sequence.push(letter);

        }

        else {

            /*
            40% target.
            */

            const target =
                Math.random() < 0.40;

            if (target) {

                sequence.push(
                    sequence[i - 2]
                );

            }

            else {

                let letter;

                do {

                    letter =
                        letters[
                            Math.floor(
                                Math.random() *
                                letters.length
                            )
                        ];

                } while (
                    letter === sequence[i - 2]
                );

                sequence.push(letter);

            }

        }

    }

    return sequence;

}


/* =====================================================
   LATIHAN
   ===================================================== */

timeline.push({

    type: jsPsychHtmlKeyboardResponse,

    stimulus: `

        <h2>Latihan</h2>

        <p>
        Ingat:
        </p>

        <h3>
        F = sama dengan 2 huruf sebelumnya
        </h3>

        <h3>
        J = tidak sama dengan 2 huruf sebelumnya
        </h3>

        <br>

        <p>
        Tekan SPASI untuk mulai latihan.
        </p>

    `,

    choices: [" "]

});


const practice =
    createSequence(10);


practice.forEach(
    function(letter, index) {

        const target =
            index >= 2 &&
            letter === practice[index - 2];

        timeline.push({

            type:
                jsPsychHtmlKeyboardResponse,

            stimulus: `

                <div
                    style="
                        font-size:100px;
                        font-weight:bold;
                    "
                >
                    ${letter}
                </div>

            `,

            choices: ["f", "j"],

            stimulus_duration: 500,

            trial_duration: 2000,

            data: {

                participant:
                    () => participantID,

                phase: "practice",

                stimulus: letter,

                target: target

            }

        });

    }
);


/* =====================================================
   JEDA SEBELUM EKSPERIMEN
   ===================================================== */

timeline.push({

    type: jsPsychHtmlKeyboardResponse,

    stimulus: `

        <h2>Latihan selesai</h2>

        <p>
        Sekarang eksperimen utama akan dimulai.
        </p>

        <p>
        Anda akan mengerjakan dua kondisi.
        </p>

        <p>
        Urutan kondisi dapat berbeda untuk setiap peserta.
        </p>

        <br>

        <p>
        Tekan SPASI untuk melanjutkan.
        </p>

    `,

    choices: [" "]

});


/* =====================================================
   FUNGSI MEMBUAT KONDISI EKSPERIMEN
   ===================================================== */

function createCondition(
    conditionName,
    deadline
) {

    const sequence =
        createSequence(22);

    const trials = [];


    /* -----------------------------
       INSTRUKSI KONDISI
       ----------------------------- */

    if (
        conditionName ===
        "tekanan_waktu"
    ) {

        trials.push({

            type:
                jsPsychHtmlKeyboardResponse,

            stimulus: `

                <h2>
                Kondisi Tekanan Waktu
                </h2>

                <p>
                Anda harus memberikan respons
                dalam waktu yang lebih singkat.
                </p>

                <p>
                Gunakan:
                </p>

                <h3>
                F = SAMA
                </h3>

                <h3>
                J = TIDAK SAMA
                </h3>

                <p>
                Jawab secepat dan seakurat mungkin.
                </p>

                <br>

                <p>
                Tekan SPASI untuk mulai.
                </p>

            `,

            choices: [" "]

        });

    }

    else {

        trials.push({

            type:
                jsPsychHtmlKeyboardResponse,

            stimulus: `

                <h2>
                Kondisi Tanpa Tekanan Waktu
                </h2>

                <p>
                Anda memiliki waktu respons
                yang lebih longgar.
                </p>

                <p>
                Gunakan:
                </p>

                <h3>
                F = SAMA
                </h3>

                <h3>
                J = TIDAK SAMA
                </h3>

                <p>
                Jawab secepat dan seakurat mungkin.
                </p>

                <br>

                <p>
                Tekan SPASI untuk mulai.
                </p>

            `,

            choices: [" "]

        });

    }


    /* -----------------------------
       TRIAL
       ----------------------------- */

    sequence.forEach(
        function(letter, index) {

            const target =
                index >= 2 &&
                letter === sequence[index - 2];


            trials.push({

                type:
                    jsPsychHtmlKeyboardResponse,

                stimulus: `

                    <div
                        style="
                            font-size:100px;
                            font-weight:bold;
                        "
                    >
                        ${letter}
                    </div>

                `,

                choices: ["f", "j"],

                stimulus_duration: 500,

                trial_duration: deadline,

                data: {

                    participant:
                        () => participantID,

                    phase: "experiment",

                    condition:
                        conditionName,

                    stimulus: letter,

                    target: target,

                    deadline:
                        deadline

                }

            });

        }
    );


    return trials;

}


/* =====================================================
   ACAK URUTAN KONDISI
   ===================================================== */

const conditions =
    jsPsych.randomization.shuffle([

        {
            name:
                "tanpa_tekanan_waktu",

            deadline:
                2000
        },

        {
            name:
                "tekanan_waktu",

            deadline:
                800
        }

    ]);


/* =====================================================
   MASUKKAN KONDISI
   ===================================================== */

conditions.forEach(
    function(condition) {

        const trials =
            createCondition(
                condition.name,
                condition.deadline
            );

        trials.forEach(
            function(trial) {

                timeline.push(trial);

            }
        );

    }
);


/* =====================================================
   SELESAI
   ===================================================== */

timeline.push({

    type:
        jsPsychHtmlKeyboardResponse,

    stimulus: `

        <h2>Eksperimen Selesai</h2>

        <p>
        Terima kasih telah mengikuti eksperimen.
        </p>

        <p>
        Tekan tombol di bawah untuk mengunduh data.
        </p>

        <br>

        <button
            id="download"
            style="
                font-size:20px;
                padding:12px 25px;
            "
        >
            Download Data
        </button>

    `,

    choices: "NO_KEYS",

    on_load: function() {

        document
            .getElementById("download")
            .addEventListener(
                "click",
                function() {

                    jsPsych.data
                        .get()
                        .localSave(
                            "csv",
                            "hasil_nback_" +
                            participantID +
                            ".csv"
                        );

                }
            );

    }

});


/* =====================================================
   JALANKAN
   ===================================================== */

jsPsych.run(timeline);

</script>

</html>
