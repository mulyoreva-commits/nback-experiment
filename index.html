// ============================================================
// MEMBUAT SEQUENCE 2-BACK
// ============================================================

function generateSequence(total) {

  const letters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  const sequence = [];


  // Dua huruf pertama
  // belum dapat dinilai

  sequence.push(
    letters[
      Math.floor(
        Math.random() *
        letters.length
      )
    ]
  );

  sequence.push(
    letters[
      Math.floor(
        Math.random() *
        letters.length
      )
    ]
  );


  // Huruf berikutnya

  for (
    let i = 2;
    i < total;
    i++
  ) {

    const target =
      Math.random() < 0.4;


    if (target) {

      // TARGET
      // sama dengan 2-back

      sequence.push(
        sequence[i - 2]
      );

    } else {

      // NON-TARGET

      let letter;

      do {

        letter =
          letters[
            Math.floor(
              Math.random() *
              letters.length
            )
          ];

      }
      while (
        letter ===
        sequence[i - 2]
      );


      sequence.push(letter);

    }

  }


  return sequence;

}

// ============================================================
// MEMBUAT TRIAL RONDE 1
// ============================================================

function createRound1Trial(
  letter,
  trialNumber,
  sequence
) {


  return {

    type:
      jsPsychHtmlKeyboardResponse,


    stimulus: `

      <div class="experiment-box">


        <!-- TIMER -->

        <div class="timer-area">

          <div class="timer-title">
            COUNTDOWN
          </div>

          <div
            id="timer-number"
            class="timer-number"
          >
            5.0
          </div>

          <div class="timer-track">

            <div
              id="timer-progress"
              class="timer-progress"
            ></div>

          </div>

        </div>


        <!-- HURUF -->

        <div class="letter">
          ${letter}
        </div>


        <!-- F J -->

        <div class="key-instruction">

          <span class="key">
            F
          </span>

          SAMA

          &nbsp;&nbsp;&nbsp;&nbsp;

          <span class="key">
            J
          </span>

          TIDAK SAMA

        </div>


      </div>

    `,


    choices:
      ["f", "j"],


    response_ends_trial:
      true,


    trial_duration:
      TIME_LIMIT,


    data: {

      phase:
        "test",

      round:
        1,

      condition:
        "timer_5_seconds",

      trial_in_round:
        trialNumber,

      stimulus:
        letter

    },


    // ========================================================
    // SAAT TRIAL DIMULAI
    // ========================================================

    on_load:
      function() {


        const start =
          performance.now();


        const timer =
          setInterval(
            function() {


              const elapsed =
                performance.now()
                - start;


              const remaining =
                Math.max(
                  0,
                  TIME_LIMIT -
                  elapsed
                );


              const seconds =
                (
                  remaining /
                  1000
                ).toFixed(1);


              // ANGKA TIMER

              const timerNumber =
                document.getElementById(
                  "timer-number"
                );


              if (timerNumber) {

                timerNumber.textContent =
                  seconds;

              }


              // PROGRESS BAR

              const progress =
                document.getElementById(
                  "timer-progress"
                );


              if (progress) {

                const percent =
                  (
                    remaining /
                    TIME_LIMIT
                  ) * 100;


                progress.style.width =
                  percent + "%";

              }


              // Jika habis

              if (
                remaining <= 0
              ) {

                clearInterval(timer);

              }


            },
            50
          );


        // Simpan timer
        // ke window agar
        // bisa dihentikan

        window.nbackTimer =
          timer;

      },


    // ========================================================
    // SETELAH F/J ATAU TIMER HABIS
    // ========================================================

    on_finish:
      function(data) {


        if (
          window.nbackTimer
        ) {

          clearInterval(
            window.nbackTimer
          );

        }


        // Dua huruf pertama
        // tidak dinilai

        if (
          trialNumber <= 2
        ) {

          data.target =
            null;

          data.correct =
            null;

          data.accuracy =
            null;

          data.timeout =
            false;

          return;

        }


        const previous =
          sequence[
            trialNumber - 3
          ];


        const isTarget =
          letter === previous;


        data.target =
          isTarget;


        // Tidak menjawab

        if (
          data.response === null
        ) {

          data.timeout =
            true;

          data.correct =
            false;

          data.accuracy =
            0;

          return;

        }


        data.timeout =
          false;


        // F = TARGET

        if (
          isTarget &&
          data.response === "f"
        ) {

          data.correct =
            true;

        }

        // J = NON TARGET

        else if (
          !isTarget &&
          data.response === "j"
        ) {

          data.correct =
            true;

        }

        else {

          data.correct =
            false;

        }


        data.accuracy =
          data.correct
            ? 1
            : 0;

      }

  };

}


// ============================================================
// FEEDBACK RONDE 1

function createRound1Feedback() {


  return {

    type:

    stimulus:
      function() {


        const last =
          jsPsych.data
            .get()
            .filter({
              phase:
                "test"
            })
            .last(1)
            .values()[0];


        // Trial 1 dan 2

        if (
          last.trial_in_round <= 2
        ) {

          return `

            <div class="feedback-screen">

              <div class="feedback">
                MULAI
              </div>

            </div>

          `;

        }


        // WAKTU HABIS

        if (
          last.timeout
        ) {

          return `

            <div class="feedback-screen">

              <div
                class="
                  feedback
                  habis
                "
              >
                ⏰ WAKTU HABIS
              </div>

              <div
                class="feedback-small"
              >
                Tidak ada jawaban
              </div>

            </div>

          `;

        }


        // BENAR

        if (

        ) {

          return `

            <div class="feedback-screen">

              <div
                class="
                  feedback
                  benar
                "
              >
                ✓ BENAR

            </div>

        }


        // SALAH

        return `

          <div class="feedback-screen">

            <div

                feedback
                salah
              "

              ✗ SALAH

      1200,


    data: {

      phase:
        "feedback",

      round:
        1

  };

}

        const previous =

        const isTarget =
          letter === previous;


        data.target =
          isTarget;


        if (
          isTarget &&
          data.response === "f"
        ) {

          data.correct =
            true;

        }

        else if (
          !isTarget &&
          data.response === "j"
        ) {

            true;

        }

        else {

          data.correct =
            false;

        }

        // Hanya data test

        const data =
          jsPsych.data
            .get()
            .filter({
              phase:
                "test"
            });


        const filename =
          "hasil_nback_" +
          participantID +
          ".csv";


        // DOWNLOAD CSV

        data.localSave(
          "csv",
          filename
        );


        // TAMPILAN BERHASIL

        document.getElementById(
          "savedMessage"
        ).innerHTML = `

          ✓ HASIL BERHASIL DISIMPAN

          <br>

          <span
            style="
              font-size:17px;
              color:#555;
            "
          >
            ${filename}
          </span>

        `;


        document.getElementById(
          "saveButton"
        ).disabled =
          true;


        document.getElementById(
          "saveButton"
        ).style.opacity =
          "0.5";

      }


      // Tombol

      document.getElementById(
        "saveButton"
      ).addEventListener(
        "click",
        saveData
      );


      // Keyboard S

      document.addEventListener(
        "keydown",
        function(event) {


          if (
            event.key.toLowerCase()
            === "s"
          ) {

            saveData();

          }

        }
      );

    }

};


// ============================================================

// ============================================================

const timeline = [

  participantScreen,

  generalInstruction,


  // =========================
  // RONDE 1
  // =========================

  round1Instruction,

  ...round1Timeline,


  // =========================
  // ISTIRAHAT
  // =========================

  breakScreen,


  // =========================
  // RONDE 2
  // =========================

  round2Instruction,

  ...round2Timeline,


  // =========================
  // SELESAI & SAVE
  // =========================

  finishScreen

];


// ============================================================
// MULAI
// ============================================================

jsPsych.run(
  timeline
);

</script>
